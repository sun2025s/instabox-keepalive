name: Keep InstaBox Alive

on:
  schedule:
    - cron: "*/25 * * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve machine id
        id: resolve
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          BODY=$(curl -sf https://api.instabox.sh/v1/machines/usc -H "X-API-Key: $INSTABOX_API_KEY")
          ID=$(printf "%s" "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id') or d['machines'][0]['id'])")
          echo "machine_id=$ID" >> "$GITHUB_OUTPUT"
      - name: Exec keepalive
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          MACHINE_ID: ${{ steps.resolve.outputs.machine_id }}
        run: |
          curl -sf -X POST "https://api.instabox.sh/v1/machines/$MACHINE_ID/exec" \
            -H "X-API-Key: $INSTABOX_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"cmd": "echo keepalive"}'
